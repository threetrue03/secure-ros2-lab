name: secure-ros2-lab
x-common: &common
  image: ${LAB_IMAGE:-secure-ros2-lab:jazzy}
  build: .
  user: "${LAB_UID:-10001}:${LAB_GID:-10001}"
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=64m,mode=1777
  networks: [lab]
  environment: &environment
    ROS_DOMAIN_ID: "42"
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    ROS_SECURITY_ENABLE: "false"
    ROS_SECURITY_STRATEGY: Enforce
    ROS_SECURITY_KEYSTORE: /keystore
    LAB_SCOPE: secure-ros2-lab-isolated
    ROS_LOG_DIR: /tmp/ros-log
    FASTRTPS_DEFAULT_PROFILES_FILE: /opt/lab/config/fastdds.xml
services:
  camera:
    <<: *common
    command: [ros2, run, secure_robot, camera_node]
  perception:
    <<: *common
    command: [ros2, run, secure_robot, perception_node]
  navigation:
    <<: *common
    command: [ros2, run, secure_robot, navigation_node]
  motor:
    <<: *common
    command: [ros2, run, secure_robot, motor_node]
  attacker:
    <<: *common
    profiles: [attack]
    command: [ros2, run, lab_attacker, attacker_node]
networks:
  lab:
    name: secure_ros2_lab
    driver: bridge
    internal: true
